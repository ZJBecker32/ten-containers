title: Ten Containers
description: >-
  Source of truth for a weekly 10-container meal prep rotation.
  Markdown in, GitHub Pages out, Crouton on the phone at the end.

# This is a project site, served from <user>.github.io/<repo>/, so baseurl
# must carry the repo name. GitHub Pages does not set it for you. Without it
# every link resolves to the domain root and 404s, and — worse — the JSON-LD
# `url` comes out wrong, which is the field Crouton imports against.
# On a custom domain, set url to the domain and baseurl to "".
url: "https://zjbecker32.github.io"
baseurl: "/ten-containers"

markdown: kramdown
kramdown:
  input: GFM

# recipes/ is deliberately NOT a Jekyll collection. Collections must live in an
# underscore-prefixed directory (_recipes/), which would contradict the layout
# documented in README.md. Recipes are plain pages instead, tagged via the
# defaults block below so the index can find them.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: "recipes"
      type: "pages"
    values:
      layout: recipe
      is_recipe: true
      permalink: /recipes/:basename/
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: page
      permalink: /docs/:basename/
  # Sessions are published so the sheet can be read on a phone at the counter.
  # It is filled in on paper or in Notes; this is the read-only copy.
  - scope:
      path: "sessions"
      type: "pages"
    values:
      layout: session
      is_session: true
      permalink: /sessions/:basename/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - sessions/README.md
  - vendor/
