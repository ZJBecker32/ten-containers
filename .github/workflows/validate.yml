name: Validate recipes

on:
  push:
    branches: ["**"]
    paths: &watched
      - "recipes/**"
      - "crumb/**"
      - "scripts/validate-recipes.rb"
      - "scripts/export-crumb.rb"
      - ".github/workflows/validate.yml"
  pull_request:
    paths: *watched
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # The validator uses only stdlib (yaml, date), so no bundle needed.
          ruby-version: "3.3"

      - name: Validate recipe frontmatter and body
        run: ruby scripts/validate-recipes.rb

      # The .crumb files are generated but committed, so the site can serve
      # them for download. This fails if a recipe changed without a re-export.
      - name: Check committed .crumb files are current
        run: ruby scripts/export-crumb.rb --check
